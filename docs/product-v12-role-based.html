<!-- Vazirmatn CDN removed for offline reliability - system fonts -->
<style>
:root{--ink:#12161C;--paper:#F7F8F6;--slate:#5B6672;--signal:#1E6F5C;--white:#fff;--line:#E3E6E2;--line2:#F1F5F9;--good:#1E7A4C;--watch:#B7791F;--alert:#B23B3B;--active:#2B6CB0;--r:12px;--font:system-ui,-apple-system,'Segoe UI',Roboto,Inter,sans-serif}
html{scrollbar-width:thin;scrollbar-color:var(--line) transparent;scrollbar-gutter:stable}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:1px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:var(--slate)}
.side-nav{scrollbar-width:thin;scrollbar-color:#334155 transparent} .side-nav::-webkit-scrollbar{width:4px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);display:flex;min-height:100vh;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-y:scroll;scrollbar-gutter:stable}
body.en{font-family:Inter,system-ui;direction:ltr}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
button,input,select,textarea{font-family:inherit}
.side{width:296px;background:var(--ink);color:#CBD5E1;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;flex-shrink:0;overflow:hidden;border-left:1px solid #1E293B}
.side-top{padding:16px 14px;border-bottom:1px solid #1E293B;display:flex;gap:10px;align-items:center}
.side-nav{flex:1;overflow:auto;padding:8px 0}
.g{padding:14px 16px 6px;font-size:12px;color:#475569;font-weight:800;letter-spacing:.11em}
.i{display:flex;gap:10px;align-items:center;padding:10px 16px;color:#94A3B8;cursor:pointer;border-right:3px solid transparent;font-size:13px;font-weight:600;transition:.15s}
.i:hover{background:#1E293B;color:#E2E8F0}.i.on{background:#1E293B;color:#fff;border-right-color:var(--signal);font-weight:800}
.i svg{width:16px;height:16px;flex-shrink:0;stroke-width:1.8}
.side-foot{padding:12px 14px;border-top:1px solid #1E293B}
.track{height:4px;background:#1E293B;border-radius:10px;overflow:hidden;margin-top:6px}.fill{height:100%;background:var(--signal)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:60px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:10;gap:8px}
.pill{border:1px solid var(--line);background:var(--white);padding:6px 12px;border-radius:24px;font-size:12.5px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.content{padding:20px;max-width:1420px;width:100%;margin:0 auto;padding-bottom:40px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1.35fr .65fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:16px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.04)}
.card.good{border-left-color:var(--good)}.card.watch{border-left-color:var(--watch)}.card.active{border-left-color:var(--active)}.card.alert{border-left-color:var(--alert)}.card.signal{border-left-color:var(--signal)}.card.ink{border-left-color:var(--ink)}
.card h3{font-size:13px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.01em}
.kpi{font-size:34px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.muted{color:var(--slate);font-size:12.5px;line-height:1.6}
.chip{font-size:11.5px;border:1px solid var(--line);padding:3px 9px;border-radius:24px;background:#fff;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.chip.good{border-color:#A7F3D0;color:var(--good)}.chip.good .chip-dot{background:var(--good)}
.chip.watch{border-color:#FDE68A;color:var(--watch)}.chip.watch .chip-dot{background:var(--watch)}
.chip.active{border-color:#BFDBFE;color:var(--active)}.chip.active .chip-dot{background:var(--active)}
.chip.alert{border-color:#FECACA;color:var(--alert)}.chip.alert .chip-dot{background:var(--alert)}
.chip.neutral{color:var(--slate)}.chip.neutral .chip-dot{background:#8B93A1}
.chip.signal{border-color:#A7F3D0;color:var(--signal)}.chip.signal .chip-dot{background:var(--signal)}
.chip.ink{border-color:var(--ink);color:var(--ink)}.chip.ink .chip-dot{background:var(--ink)}
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:12.5px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{transform:translateY(-1px);border-color:var(--slate);box-shadow:0 2px 8px rgba(0,0,0,.06)}.btn-p{background:var(--ink);color:#fff;border-color:var(--ink)}.btn-s{background:var(--signal);color:#fff;border-color:var(--signal)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}.btn-ghost{border-color:transparent;background:transparent}.btn-ghost:hover{background:var(--line2);border-color:var(--line2)}

.input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;background:#fff;transition:.15s}.input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(18,22,28,.06)}
.bar{height:6px;background:var(--line2);border-radius:10px;overflow:hidden;display:flex}.bar div{height:100%;transition:width .5s}
.lang{display:flex;background:var(--line2);border-radius:9px;padding:2px;gap:2px}.lang button{padding:5px 10px;border-radius:7px;border:none;background:transparent;font-weight:800;font-size:12px;cursor:pointer;color:var(--slate)}.lang button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.modal{position:fixed;inset:0;background:rgba(18,22,28,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}.modal.open{display:flex}
.box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:960px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.role-context{background:#0F172A;color:#CBD5E1;border:1px solid #1E293B;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.coach-badge{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:12.5px}

.task-card{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:10px;background:#fff;font-size:12.5px;transition:.15s}
.task-card.done{border-left-color:var(--good);background:#F0FDF4}.task-card.active{border-left-color:var(--active);background:#EFF6FF}.task-card.pending{border-left-color:var(--line)}.task-card.overdue{border-left-color:var(--alert);background:#FEF2F2}
.pod-mini{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:12px;background:#fff;transition:.15s;cursor:pointer}
.pod-mini:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.05)}
.pod-mini.good{border-left-color:var(--good)}.pod-mini.watch{border-left-color:var(--watch)}.pod-mini.active{border-left-color:var(--active)}.pod-mini.alert{border-left-color:var(--alert)}
.internal-role-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;transition:.15s;position:relative;overflow:hidden}
.internal-role-card:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.04)}
.internal-role-card.trial{border-style:dashed}.internal-role-card.unfilled{background:var(--line2);border-style:dashed}
.internal-role-card .role-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.internal-role-card .role-title{font-weight:900;font-size:12.5px;display:flex;gap:6px;align-items:center}
.internal-role-card .role-countdown{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--ink);color:#fff;font-weight:700}
.internal-role-card .role-countdown.warn{background:var(--watch)}.internal-role-card .role-countdown.alert{background:var(--alert)}
.network-graph{width:100%;height:360px;border:1px solid var(--line);border-radius:12px;background:#fff;position:relative;overflow:hidden}
.cycle-wheel{width:180px;height:180px;border-radius:50%;position:relative;margin:0 auto;border:8px solid var(--line2);display:grid;place-items:center;flex-shrink:0}
.cycle-wheel-inner{width:96px;height:96px;border-radius:50%;background:var(--white);border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.2}
.automation-log{border:1px dashed var(--line);background:var(--paper);border-radius:10px;padding:10px;font-size:12px;line-height:1.7;max-height:180px;overflow:auto}
.needs{border:1px solid #FDE68A;background:#FFFBEB;border-radius:12px;padding:12px}
.needs-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #FEF3C7}.needs-item:last-child{border-bottom:none}
.search-row{position:sticky;top:60px;z-index:9;background:rgba(247,248,246,.96);backdrop-filter:blur(8px);padding:12px 0;margin:-20px -20px 16px -20px;padding:12px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.icon-xs{width:14px;height:14px;stroke-width:1.8;flex-shrink:0}.icon-sm{width:16px;height:16px;stroke-width:1.8;flex-shrink:0}.icon-md{width:20px;height:20px;stroke-width:1.7;flex-shrink:0}
.reveal{animation:rev .35s ease both}@keyframes rev{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.jalali-picker{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.jalali-picker select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;background:#fff;min-width:76px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:rgba(255,255,255,.98);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:none;z-index:20;align-items:center;justify-content:space-around;padding:0 4px}
.b-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:10px;cursor:pointer;color:var(--slate);font-size:11px;font-weight:700;min-width:56px;transition:.15s}.b-item.on{background:var(--ink);color:#fff}.b-item svg{width:18px;height:18px;stroke-width:1.8}
.dist-bar{display:flex;gap:2px;height:10px;border-radius:10px;overflow:hidden;background:var(--line2)}
.kbd{font-family:ui-monospace,monospace;font-size:12px;background:var(--line2);border:1px solid var(--line);border-bottom-width:2px;padding:2px 6px;border-radius:5px;font-weight:700}
.table{width:100%;border-collapse:collapse;font-size:12.5px}.table th{text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);font-size:11px;color:var(--slate);font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.en .table th{text-align:left}.table td{padding:10px 8px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;vertical-align:top}
/* Coach specific */
.coach-layout{display:grid;grid-template-columns:280px 1fr;gap:14px}
.coach-sidebar{position:sticky;top:80px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;scrollbar-width:thin}
.coach-company{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;cursor:pointer;transition:.15s;margin-bottom:8px}
.coach-company:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.coach-company.on{border-color:var(--ink);background:var(--ink);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}

.coach-company.good{border-left:4px solid var(--good)}.coach-company.watch{border-left:4px solid var(--watch)}.coach-company.alert{border-left:4px solid var(--alert)}
.coach-tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--line2);padding:4px;border-radius:10px;margin-bottom:14px}
.coach-tabs button{padding:7px 12px;border-radius:8px;border:none;background:transparent;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--slate);transition:.15s}
.coach-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.coach-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.coach-advisory{border:1px dashed var(--watch);background:#FFFBEB;border-radius:10px;padding:10px;font-size:12.5px;line-height:1.7}
.coach-private{border:1px solid var(--ink);background:#F8FAFC;border-radius:10px;padding:10px;font-size:12.5px}
.coach-shared{border:1px solid var(--signal);background:#F0FDF4;border-radius:10px;padding:10px;font-size:12.5px}
@media(max-width:1024px){.coach-layout{grid-template-columns:1fr}.coach-sidebar{position:static;max-height:none}.coach-detail-grid{grid-template-columns:1fr}}
@media(max-width:1280px){.side{width:64px}.hide{display:none !important}.i{justify-content:center;padding:12px 8px}.side-top{justify-content:center;padding:12px 8px}.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.side{display:none}.bottom{display:flex}.content{padding:14px;padding-bottom:76px}.g2,.g3,.g4{grid-template-columns:1fr}.top{height:56px;padding:0 12px}.kpi{font-size:30px}.table thead{display:none}.table tr{display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:10px;background:#fff}.table td{display:flex;justify-content:space-between;align-items:center;border:none;padding:6px 0;border-bottom:1px solid #F8FAFC}.table td:last-child{border-bottom:none}.table td::before{content:attr(data-label);font-weight:800;color:var(--slate);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}.en .table td::before{margin-left:0;margin-right:8px}.box{padding:16px;margin:6px}.search-row{top:56px}}
</style>

// Icons — Professional SVG — No Emoji
const ICONS={
pods:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>`,

function toFaDigits(s){return String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);}
function div(a,b){return Math.floor(a/b);}
function g2j(gy,gm,gd){let g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];let gy2=(gm>2)?(gy+1):gy;let days=355666+365*gy+div(gy2+3,4)-div(gy2+99,100)+div(gy2+99,400)+gd+g_d_m[gm-1];let jy=-1595+33*div(days,12053);days%=12053;jy+=4*div(days,1461);days%=1461;if(days>365){jy+=div(days-1,365);days=(days-1)%365;}let jm,jd;if(days<186){jm=1+div(days,31);jd=1+days%31;}else{jm=7+div(days-186,30);jd=1+(days-186)%30;}return [jy,jm,jd];}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+div(jy,33)*8+div((jy%33+3),4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30+186));let gy=400*div(days,146097);days%=146097;if(days>36524){gy+=100*div(--days,36524);days%=36524;if(days>=365)days++;}gy+=4*div(days,1461);days%=1461;if(days>365){gy+=div(days-1,365);days=(days-1)%365;}let gd=days+1;let sal_a=[0,31,((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>sal_a[gm];gm++)gd-=sal_a[gm];return [gy,gm,gd];}
const JM_FA=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function fmtJalali(iso){if(!iso)return '';try{const [y,m,d]=iso.split('T')[0].split('-').map(Number);const [jy,jm,jd]=g2j(y,m,d);return `${jd} ${JM_FA[jm-1]}`;}catch(e){return iso;}}
function fmtJalaliFull(iso){try{const [y,m,d]=iso.split('T')[0].split('-').map(Number);const [jy,jm,jd]=g2j(y,m,d);return `${jd} ${JM_FA[jm-1]} ${jy}`;}catch(e){return iso;}}
function formatDateFull(iso){const j=isoToJalali(iso);if(!j)return iso;return `${j.jd} ${JM_FA[j.jm-1]} ${j.jy} (${iso})`;}
function isoToJalali(iso){if(!iso)return null;try{const [y,m,d]=iso.split('T')[0].split('-').map(n=>parseInt(n));const [jy,jm,jd]=g2j(y,m,d);return {jy,jm,jd,y,m,d,iso};}catch(e){return null;}}

function scoreCalc(f,p,s){return +(0.4*f+0.35*p+0.25*s).toFixed(2);}
function calcBudgets(){
  const total=DB.cycle.totalPool;
  const sum=DB.budgets.reduce((s,b)=>s+b.score,0);
  const reserved=DB.budgets.reduce((s,b)=>s+b.survival,0);
  let remaining=Math.max(0,total-reserved);
  let res=DB.budgets.map(b=>({podId:b.podId,score:b.score,survival:b.survival,raw:sum?(b.score/sum)*remaining:0,final:0,capped:false}));
  let iter=0;
  while(iter<10){
    let excess=0, nonScore=0;
    res.forEach(r=>{
      const cand=r.survival+r.raw;
      const cap=total*0.30;
      if(cand>cap){excess+=(cand-cap); r.final=cap; r.capped=true; r.raw=cap-r.survival;} else {r.final=cand; r.capped=false; nonScore+=r.score;}
    });
    if(excess<1 || nonScore===0) break;
    res.forEach(r=>{if(!r.capped){const add=(r.score/nonScore)*excess; const nf=r.final+add; const cap=total*0.30; if(nf>cap){r.final=cap; r.raw=cap-r.survival; r.capped=true;} else {r.final=nf; r.raw+=add;}}});
    if(!res.some(r=>!r.capped && r.final>total*0.30+0.01)) break;
    iter++;
  }
  res.forEach(r=>{
    const b=DB.budgets.find(x=>x.podId===r.podId);
    if(b){b.raw=r.raw; b.final=r.final; b.alloc=+(r.final/total*100).toFixed(1); b.capped=r.capped; b.auditHash=btoa(JSON.stringify({podId:r.podId,score:r.score,final:r.final})).slice(0,12); b.score=scoreCalc(b.fin,b.peer,b.strat);}
  });
  DB.cycle.status=DB.cycle.day>=89?'locked':'provisional';
}

function filterCoachCompanies(q){
  if(!q){renderDashboard(); return;}
  const list=document.getElementById('coachCompanyList');
  if(!list) return;
  const lower=q.toLowerCase();
  const myCoaching=getMyCoaching();
  const filtered=myCoaching.filter(c=>{
    const pod=DB.pods.find(p=>p.id===c.podId);
    return (pod.fa||'').toLowerCase().includes(lower)||(pod.en||'').toLowerCase().includes(lower)||(pod.categoryFa||'').toLowerCase().includes(lower)||(c.coachFa||'').toLowerCase().includes(lower);
  });
  list.innerHTML=filtered.map(c=>{
    const pod=DB.pods.find(p=>p.id===c.podId);
    const isAlert=c.healthNum<70;
    const isWatch=c.healthNum>=70&&c.healthNum<80;
    const isOn=c.podId===coachSelectedPodId;
    return `<div class="coach-company ${isOn?'on':''} ${isAlert?'alert':isWatch?'watch':'good'}" onclick="selectCoachPod('${c.podId}')">
      <div style="display:flex;justify-content:space-between"><strong style="font-size:12.5px">${pn(pod)} — ${pod.categoryFa}</strong><span class="chip ${isAlert?'alert':isWatch?'watch':'good'}" style="font-size:10px"><span class="chip-dot"></span>${toFaDigits(c.healthNum)}%</span></div>
      <div class="muted" style="font-size:11px;margin-top:4px">${pod.holdingFa} • ${toFaDigits(pod.members)} نفر • ${fmtJalali(c.signal.lastCalc.split('T')[0])}</div>
    </div>`;
  }).join('')||'<div class="muted">بدون نتیجه</div>';
}

function exportCoachReport(){
  const myCoaching=getMyCoaching();
  const todayJ=fmtJalaliFull(new Date().toISOString().split('T')[0]);
  let report=`گزارش کوچ — ${todayJ} — ${new Date().toISOString().split('T')[0]}\n\n`;
  report+=`کوچ: سارا احمدی — sara@ecosystem.os — ${toFaDigits(myCoaching.length)} شرکت زیر دست — هدف ۳-۵ — Buurtzorg 20 coaches 40-50 teams — 1:660\n`;
  report+=`میانگین سلامت: ${toFaDigits(Math.round(myCoaching.reduce((s,c)=>s+c.healthNum,0)/myCoaching.length))}% — کل اعضا: ${toFaDigits(DB.pods.filter(p=>ROLES.coach.podIds.includes(p.id)).reduce((s,p)=>s+p.members,0))}\n\n`;
  myCoaching.forEach(c=>{
    const pod=DB.pods.find(p=>p.id===c.podId);
    report+=`${pn(pod)} — ${toFaDigits(c.healthNum)}% — ${c.health} — ${toFaDigits(c.atRisk)} at-risk — ${c.engagement.rate}% تعامل — ${c.engagement.trend} — ${c.engagement.risk} risk — آخرین فعالیت: ${fmtJalali(c.engagement.lastActive)} — جلسه بعدی: ${c.nextSession?fmtJalali(c.nextSession):'—'}\n`;
    report+=`  Health Signal: ${c.signal.from} — ${c.signal.calc} — ${fmtJalali(c.signal.lastCalc.split('T')[0])}\n`;
    report+=`  Contributing: atRisk ${toFaDigits(c.signal.contributingFactors.atRiskCheckins)} — trend ${c.signal.contributingFactors.scoreTrend} — sentiment ${c.signal.contributingFactors.reviewSentiment}\n`;
    report+=`  Sessions: ${c.sessions.length} — ${c.sessions.map(s=>`${fmtJalali(s.date)} ${lang==='fa'?s.typeFa:s.typeEn} ${s.private?'خصوصی':'قابل مشاهده'}`).join('، ')}\n`;
    report+=`  Tasks: ${pod.tasks.length} — ${pod.tasks.map(t=>`${t.titleFa} — Day ${t.dueDay} — ${t.status}`).join('، ')}\n`;
    report+=`  Goals: ${pod.goals.length} — ${pod.goals.map(g=>`${g.titleFa} — ${g.progress}%`).join('، ')}\n\n`;
  });
  const blob=new Blob([report],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`coach-report-${fmtJalali(new Date().toISOString().split('T')[0])}.txt`;
  a.click();
}

function saveTask(podId){
  const pod=DB.pods.find(p=>p.id===podId);

  const priority=document.getElementById('taskPriority')?.value?.split(' — ')[0]||'medium';
  const due=parseInt(document.getElementById('taskDue')?.value||DB.cycle.day);
  const assignee=document.getElementById('taskAssignee')?.value||pod.lead;
  if(pod){
    pod.tasks.push({id:'t'+Date.now(),titleFa:title,titleEn:title,dueDay:due,status:'active',phase:'4-80',role:role,assigneeFa:assignee,priority:priority});
    // Add to coaching upcomingTasks

    if(coaching){coaching.upcomingTasks.push({titleFa:title,titleEn:title,dueDay:due,status:'active',priority:priority});}
  }
  closeM();
  renderDashboard();
}
