<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--ink:#12161C;--paper:#F7F8F6;--slate:#5B6672;--signal:#1E6F5C;--white:#fff;--line:#E3E6E2;--line2:#F1F5F9;--good:#1E7A4C;--watch:#B7791F;--alert:#B23B3B;--active:#2B6CB0;--font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-gutter:stable}
body{font-family:var(--font);background:var(--paper);color:var(--ink);display:flex;min-height:100vh;line-height:1.8;font-size:13px;-webkit-font-smoothing:antialiased}
body.en{font-family:Inter,system-ui;direction:ltr}
.side{width:280px;background:var(--ink);color:#CBD5E1;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;flex-shrink:0;overflow:hidden;border-left:1px solid #1E293B}
.side-top{padding:14px 12px;border-bottom:1px solid #1E293B;display:flex;gap:10px;align-items:center}
.side-nav{flex:1;overflow:auto;padding:8px 0}
.g{padding:12px 14px 6px;font-size:11px;color:#64748B;font-weight:800;letter-spacing:.08em}
.i{display:flex;gap:10px;align-items:center;padding:9px 14px;color:#94A3B8;cursor:pointer;border-right:3px solid transparent;font-size:12.5px;font-weight:600;transition:.15s}
.i:hover{background:#1E293B;color:#E2E8F0}.i.on{background:#1E293B;color:#fff;border-right-color:var(--signal);font-weight:800}
.side-foot{padding:10px 12px;border-top:1px solid #1E293B;font-size:11px;color:#64748B}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:56px;background:rgba(255,255,255,.98);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:20;gap:8px;flex-wrap:wrap}
.content{padding:16px;max-width:1280px;width:100%;margin:0 auto;padding-bottom:80px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1.35fr .65fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:14px;transition:.15s}
.card.good{border-left-color:var(--good)}.card.watch{border-left-color:var(--watch)}.card.alert{border-left-color:var(--alert)}.card.signal{border-left-color:var(--signal)}.card.ink{border-left-color:var(--ink)}.card.active{border-left-color:var(--active)}
.kpi{font-size:30px;font-weight:900}.muted{color:var(--slate);font-size:11.5px}
.chip{font-size:10.5px;border:1px solid var(--line);padding:3px 8px;border-radius:20px;background:#fff;font-weight:700;display:inline-flex;gap:4px}
.btn{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:12px;cursor:pointer}
.btn-p{background:var(--ink);color:#fff;border-color:var(--ink)}.btn-s{background:var(--signal);color:#fff;border-color:var(--signal)}
.input{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:12px;background:#fff}
.lang{display:flex;background:var(--line2);border-radius:8px;padding:2px;gap:2px}.lang button{padding:5px 10px;border-radius:6px;border:none;background:transparent;font-weight:800;font-size:11px;cursor:pointer;color:var(--slate)}.lang button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bottom{position:fixed;bottom:0;left:0;right:0;height:60px;background:rgba(255,255,255,.98);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:none;z-index:30;justify-content:space-around;align-items:center;padding:0 4px}
.b-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--slate);font-size:9px;font-weight:700;min-width:50px}.b-item.on{background:var(--ink);color:#fff}
@media(max-width:1100px){.side{width:64px}.hide{display:none!important}.i{justify-content:center;padding:10px 6px}.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.side{display:none}.bottom{display:flex}.content{padding:12px;padding-bottom:72px}.g2,.g3,.g4{grid-template-columns:1fr}.top{height:auto;min-height:56px;padding:8px 12px}.kpi{font-size:26px}}
</style>
</head>
<body>
<div class="side" id="side">
<div class="side-top">
<div style="width:36px;height:36px;background:linear-gradient(135deg,#1E6F5C,#0F172A);border-radius:10px;display:grid;place-items:center"><svg viewBox="0 0 100 100" width="20" height="20"><path d="M50 4 L88 24 L88 72 L50 92 L12 72 L12 24 Z" fill="none" stroke="#fff" stroke-width="3"/><circle cx="28" cy="32" r="5" fill="#fff"/><circle cx="72" cy="32" r="5" fill="#fff"/><circle cx="28" cy="70" r="5" fill="#FACC15"/><circle cx="72" cy="70" r="5" fill="#fff"/></svg></div>
<div class="hide"><div style="font-weight:900;color:#fff;font-size:14px">Ecosystem OS</div><div style="font-size:10px;color:#94A3B8">V18 FINAL — Responsive — 5 شرکت</div></div>
</div>
<div class="side-nav" id="nav"></div>
<div class="side-foot hide">
<div style="display:flex;justify-content:space-between"><span>چرخه ۱۲</span><span id="pct">52%</span></div>
<div style="height:4px;background:#1E293B;border-radius:8px;margin-top:6px;overflow:hidden"><div id="bar" style="height:100%;background:#1E6F5C;width:52%"></div></div>
<div style="margin-top:8px"><span class="chip" style="background:#1E293B;color:#E2E8F0;border-color:#334155"><span id="roleBadge">کوچ</span></span></div>
<div style="margin-top:6px;font-size:9px;color:#475569">Coach: 5 شرکت — Ratio 1:3-5<br>Jalali: ۲۴ اردیبهشت ۱۴۰۴</div>
</div>
</div>

<div class="main">
<div class="top">
<div style="display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap">
<div style="width:32px;height:32px;background:linear-gradient(135deg,#1E6F5C,#0F172A);border-radius:8px;display:grid;place-items:center"><svg viewBox="0 0 100 100" width="18" height="18"><path d="M50 4 L88 24 L88 72 L50 92 L12 72 L12 24 Z" fill="none" stroke="#fff" stroke-width="3"/><circle cx="28" cy="32" r="5" fill="#fff"/><circle cx="72" cy="32" r="5" fill="#fff"/><circle cx="28" cy="70" r="5" fill="#FACC15"/><circle cx="72" cy="70" r="5" fill="#fff"/></svg></div>
<div style="font-weight:900;font-size:14px" id="title">داشبورد کوچ — ۵ شرکت</div>
<div class="chip hide" style="font-size:10px"><span id="cycle">روز ۴۷ • اجرا • #۱۲ — ۲۴ اردیبهشت</span></div>
</div>
<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
<select id="roleSwitch" class="input" style="width:200px;font-weight:700;font-size:11px" onchange="switchRole(this.value)">
<option value="holding_executive">مدیر کل — Org Rollup</option>
<option value="pod_lead">لید پاد — پارس پرداخت</option>
<option value="pod_member">عضو پاد — پارس پرداخت</option>
<option value="housekeeper">Housekeeper — خزانه‌دار</option>
<option value="informer">Informer — Portal</option>
<option value="developer">Developer — دانش</option>
<option value="planner">Planner — زمان‌بندی</option>
<option value="team_player">Team Player — سلامت</option>
<option value="mentor">Mentor — Onboarding</option>
<option value="peer_validator">ارزیاب همتا</option>
<option value="conflict_resolver">مصلح — Resolver</option>
<option value="coach" selected>کوچ — ۵ شرکت — Complete</option>
<option value="coaching_hub">هاب کوچینگ — Matrix</option>
<option value="deployment_hub">هاب دیپلوی — Wizard</option>
<option value="architecture_hub">هاب معماری — Rules</option>
<option value="strategic_hub">هاب استراتژیک — Reports</option>
<option value="investor">سرمایه‌گذار — Aggregated</option>
</select>
<div class="lang"><button id="bFa" class="on" onclick="setLang('fa')">فا</button><button id="bEn" onclick="setLang('en')">EN</button></div>
</div>
</div>
<div class="content" id="content"></div>
</div>

<div class="bottom" id="bottom"></div>

<script>
const ROLES={
holding_executive:{fa:'مدیر کل — Org Rollup',en:'GM — Org Rollup',scope:'org',color:'#1E6F5C'},
pod_lead:{fa:'لید پاد — پارس پرداخت',en:'Pod Lead',scope:'pod',podId:'p1',color:'#2B6CB0'},
pod_member:{fa:'عضو پاد — پارس پرداخت',en:'Pod Member',scope:'pod',podId:'p1',color:'#7C3AED'},
housekeeper:{fa:'Housekeeper — خزانه‌دار',en:'Housekeeper',scope:'pod',podId:'p1',color:'#B7791F'},
informer:{fa:'Informer — Portal',en:'Informer',scope:'pod',podId:'p1',color:'#1E6F5C'},
developer:{fa:'Developer — دانش',en:'Developer',scope:'pod',podId:'p1',color:'#2B6CB0'},
planner:{fa:'Planner — زمان‌بندی',en:'Planner',scope:'pod',podId:'p1',color:'#7C3AED'},
team_player:{fa:'Team Player — سلامت',en:'Team Player',scope:'pod',podId:'p1',color:'#B23B3B'},
mentor:{fa:'Mentor — Onboarding',en:'Mentor',scope:'pod',podId:'p1',color:'#5B6672'},
peer_validator:{fa:'ارزیاب همتا',en:'Peer Validator',scope:'validator',color:'#B23B3B'},
conflict_resolver:{fa:'مصلح — Resolver',en:'Resolver',scope:'resolver',color:'#7C3AED'},
coach:{fa:'کوچ — ۵ شرکت — Complete',en:'Coach — 5 Companies',scope:'coach',podIds:['p1','p2','p3','p4','p5'],color:'#B7791F'},
coaching_hub:{fa:'هاب کوچینگ — Matrix',en:'Coaching Hub',scope:'coaching_hub',color:'#1E293B'},
deployment_hub:{fa:'هاب دیپلوی — Wizard',en:'Deployment Hub',scope:'deployment_hub',color:'#2B6CB0'},
architecture_hub:{fa:'هاب معماری — Rules',en:'Architecture Hub',scope:'architecture_hub',color:'#12161C'},
strategic_hub:{fa:'هاب استراتژیک',en:'Strategic Hub',scope:'strategic_hub',color:'#7C3AED'},
investor:{fa:'سرمایه‌گذار — Aggregated',en:'Investor',scope:'investor',color:'#5B6672'},
};

let lang='fa', currentRole='coach';
try{const s=localStorage.getItem('eco_v18_lang'); if(s) lang=s; const r=localStorage.getItem('eco_v18_role'); if(r) currentRole=r;}catch(e){}

function setLang(l){
lang=l;
try{localStorage.setItem('eco_v18_lang',l)}catch(e){}
document.documentElement.lang=l;
document.documentElement.dir=l==='fa'?'rtl':'ltr';
document.body.className=l==='en'?'en':'';
document.getElementById('bFa').className=l==='fa'?'on':'';
document.getElementById('bEn').className=l==='en'?'on':'';
renderAll();
}
function switchRole(r){
currentRole=r;
try{localStorage.setItem('eco_v18_role',r)}catch(e){}
const ctx=ROLES[r];
document.getElementById('roleBadge').textContent=ctx.fa.split(' — ')[0];
renderAll();
}
function t(fa,en){return lang==='fa'?fa:en;}

const DB={
cycle:{day:47,num:12,phaseFa:'اجرا',phaseEn:'Execution',totalPool:2500000000},
pods:[
{id:'p1',fa:'پارس پرداخت',en:'Pars Payments',health:82,members:8,holdingFa:'هلدینگ پارس',lead:'سارا عباسی',categoryFa:'فین‌تک',fixed:120000000,alloc:32.8,score:76.6,final:710000000},
{id:'p2',fa:'تحلیل ریسک',en:'Risk Analytics',health:64,members:12,holdingFa:'هلدینگ پارس',lead:'علی رضایی',categoryFa:'داده و ریسک',fixed:100000000,alloc:32.7,score:76.5,final:650000000,atRisk:2},
{id:'p3',fa:'آزمایشگاه رشد',en:'Growth Lab',health:71,members:6,holdingFa:'هلدینگ پارس',lead:'مریم کاظمی',categoryFa:'رشد',fixed:80000000,alloc:28.5,score:71.2,final:580000000},
{id:'p4',fa:'آریا لجستیک',en:'Aria Logistics',health:79,members:14,holdingFa:'هلدینگ آریا',lead:'رضا حسینی',categoryFa:'لجستیک',fixed:90000000,alloc:30.2,score:72.3,final:620000000},
{id:'p5',fa:'هوش مصنوعی پیشرو',en:'Pishro AI',health:85,members:10,holdingFa:'هلدینگ پیشرو',lead:'نازنین احمدی',categoryFa:'هوش مصنوعی',fixed:110000000,alloc:34.1,score:83.5,final:820000000},
],
coaching:[
{id:'c1',podId:'p1',podFa:'پارس پرداخت',health:82,atRisk:0,coachFa:'سارا احمدی',coachEmail:'sara@ecosystem.os',capacity:'comfortable'},
{id:'c2',podId:'p2',podFa:'تحلیل ریسک',health:64,atRisk:2,coachFa:'سارا احمدی',coachEmail:'sara@ecosystem.os',capacity:'stretched'},
{id:'c3',podId:'p3',podFa:'آزمایشگاه رشد',health:71,atRisk:0,coachFa:'سارا احمدی',coachEmail:'sara@ecosystem.os',capacity:'comfortable'},
{id:'c4',podId:'p4',podFa:'آریا لجستیک',health:79,atRisk:0,coachFa:'سارا احمدی',coachEmail:'sara@ecosystem.os',capacity:'comfortable'},
{id:'c5',podId:'p5',podFa:'هوش مصنوعی پیشرو',health:85,atRisk:0,coachFa:'سارا احمدی',coachEmail:'sara@ecosystem.os',capacity:'comfortable'},
],
};

let curPage='investor';

function renderNav(){
const nav=document.getElementById('nav'), bottom=document.getElementById('bottom');
const items=[
{id:'dashboard',fa:'داشبورد نقشی',en:'Role Dashboard'},
{id:'pods',fa:'پادها + ۷ نقش',en:'Pods + 7 Roles'},
{id:'agreements',fa:'توافق‌ها CLOU',en:'Agreements'},
{id:'budget',fa:'بودجه',en:'Budget'},
{id:'calendar',fa:'تقویم جلالی',en:'Calendar'},
{id:'coaching',fa:'کوچینگ — ۵ شرکت',en:'Coaching 5'},
{id:'review',fa:'حاکمیت + داوری',en:'Governance'},
{id:'hub',fa:'هاب — ۴ هاب',en:'Hub'},
{id:'investor',fa:'سرمایه‌گذار',en:'Investor'},
{id:'archive',fa:'آرشیو',en:'Archive'},
{id:'notifications',fa:'اعلان‌ها',en:'Notifications'},
];
const groups=[
{tFa:'اصلی',tEn:'MAIN',ids:['dashboard','pods','agreements','budget','calendar']},
{tFa:'حاکمیت',tEn:'GOVERNANCE',ids:['coaching','review','hub']},
{tFa:'سیستم',tEn:'SYSTEM',ids:['investor','archive','notifications']},
];
let h='';
groups.forEach(g=>{
h+=`<div class="g hide">${lang==='fa'?g.tFa:g.tEn}</div>`;
g.ids.forEach(id=>{
const it=items.find(x=>x.id===id);
h+=`<div class="i ${curPage===id?'on':''}" onclick="go('${id}')"><span>●</span><span class="hide">${lang==='fa'?it.fa:it.en}</span></div>`;
});
});
nav.innerHTML=h;
let bh='';
['dashboard','pods','budget','coaching','notifications'].forEach(id=>{
const it=items.find(x=>x.id===id);
bh+=`<div class="b-item ${curPage===id?'on':''}" onclick="go('${id}')"><span>●</span><span>${lang==='fa'?it.fa:it.en}</span></div>`;
});
bottom.innerHTML=bh;
document.getElementById('pct').textContent=Math.round(DB.cycle.day/90*100)+'%';
document.getElementById('bar').style.width=Math.round(DB.cycle.day/90*100)+'%';
document.getElementById('cycle').textContent=lang==='fa'?`روز ${DB.cycle.day}/90 • ${DB.cycle.phaseFa} • #${DB.cycle.num}`:`Day ${DB.cycle.day}/90 — ${DB.cycle.phaseEn}`;
}

function go(id){
curPage=id;
renderNav();
const titles={dashboard:'داشبورد کوچ — ۵ شرکت',pods:'پادها + ۷ نقش داخلی',agreements:'توافق‌ها CLOU',budget:'بودجه — ۴۰/۳۵/۲۵',calendar:'تقویم جلالی — ۵ فاز',coaching:'کوچینگ — ۵ شرکت',review:'حاکمیت + داوری',hub:'هاب — ۴ هاب',investor:'سرمایه‌گذار — Aggregated',archive:'آرشیو',notifications:'اعلان‌ها'};
document.getElementById('title').textContent=titles[id]||id;
const map={dashboard:renderDashboard,pods:renderPods,agreements:renderAgreements,budget:renderBudget,calendar:renderCalendar,coaching:renderDashboard,review:renderReview,hub:renderHub,investor:renderInvestor,archive:renderArchive,notifications:renderNotifs};
(map[id]||renderDashboard)();
}

function renderDashboard(){
const ctx=ROLES[currentRole];
const myPods=ctx.scope==='org'||ctx.scope==='coaching_hub'||ctx.scope==='deployment_hub'||ctx.scope==='architecture_hub'||ctx.scope==='strategic_hub'||ctx.scope==='investor'?DB.pods:ctx.scope==='coach'?DB.pods.filter(p=>ctx.podIds.includes(p.id)):DB.pods.filter(p=>p.id===ctx.podId);
const totalMembers=myPods.reduce((s,p)=>s+p.members,0);
const avgHealth=Math.round(myPods.reduce((s,p)=>s+p.health,0)/myPods.length);
const atRisk=myPods.filter(p=>p.atRisk>0).length;
let html=`<div style="background:#0F172A;color:#CBD5E1;border-radius:12px;padding:12px;margin-bottom:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><strong>${ctx.fa}</strong> — ${myPods.length} پاد — ${totalMembers} نفر — روز ۴۷/۹۰ — ۲۴ اردیبهشت ۱۴۰۴</div><div><span class="chip" style="background:#1E293B;color:#E2E8F0">فا/EN کار می‌کنه</span><span class="chip" style="background:#1E293B;color:#E2E8F0">۱۷ نقش — هر کدام داشبورد</span></div></div>`;

html+=`<div class="grid g4"><div class="card good"><div class="muted">میانگین سلامت</div><div class="kpi">${avgHealth}%</div><div class="muted">${myPods.length} شرکت — ۲۴ اردیبهشت</div></div><div class="card ${atRisk>0?'alert':'good'}"><div class="muted">at-risk</div><div class="kpi">${atRisk}</div><div class="muted">${myPods.reduce((s,p)=>s+(p.atRisk||0),0)} عضو at-risk</div></div><div class="card signal"><div class="muted">برتر</div><div class="kpi">${myPods.filter(p=>p.health>=80).length}</div><div class="muted">۸۵٪ vs ملی ۶۵٪</div></div><div class="card active"><div class="muted">کل اعضا</div><div class="kpi">${totalMembers}</div><div class="muted">هدف ۳-۵ — Buurtzorg 1:660</div></div></div>`;

html+=`<div class="card ink" style="margin-top:12px"><h3>نبض سازمان — ۵ پاد — بودجه ۲.۵B — فرمول ۴۰/۳۵/۲۵ — فونت متعادل ۱۳px</h3><div class="grid g3" style="margin-top:10px">`;
myPods.forEach(p=>{
html+=`<div class="card ${p.health>=75?'good':p.health>=60?'watch':'alert'}"><strong>${p.fa}</strong> — ${p.health}% — ${p.categoryFa} — ${p.members} نفر<br><span class="muted">${p.holdingFa} • لید: ${p.lead} — ۴۳ روز باقی — ${p.alloc}% — ${Math.round(p.final/1000000)}M — Score ${p.score}</span><br><div style="margin-top:8px;display:flex;gap:6px"><button class="btn btn-p" style="flex:1" onclick="alert('View Pod ${p.fa}')">View →</button><button class="btn" style="flex:1" onclick="alert('Edit ${p.fa}')">Edit</button></div></div>`;
});
html+=`</div></div>`;

html+=`<div class="card signal" style="margin-top:12px"><h3>کوچ — ۵ شرکت زیر دست — به تفکیک انتخاب + اطلاعات + ادیت + جلسه — سارا احمدی</h3><div class="grid g2" style="margin-top:10px">`;
DB.coaching.forEach(c=>{
const pod=DB.pods.find(p=>p.id===c.podId);
html+=`<div class="card ${c.health>=75?'good':c.health>=60?'watch':'alert'}"><strong>${c.podFa}</strong> — ${c.health}% — ${c.atRisk>0?c.atRisk+' at-risk — نیاز جلسه فوری':'OK'}<br><span class="muted">${c.coachFa} — ${c.coachEmail} — ${c.capacity} — ${pod.members} نفر</span><br><div style="margin-top:8px;display:flex;gap:6px"><button class="btn btn-p" style="flex:1">اطلاعات</button><button class="btn" style="flex:1">ادیت</button><button class="btn" style="flex:1">جلسه</button></div></div>`;
});
html+=`</div></div>`;

document.getElementById('content').innerHTML=html;
}

function renderPods(){
